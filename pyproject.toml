[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-cli"
version = "0.1.0"
description = "Интерактивный подсчет токенов и сборка кода для LLM"
requires-python = ">=3.10"
dependencies = [
    "tiktoken",
    "pathspec",
    "questionary",
]

[project.scripts]
ctx = "context_cli:main"

[tool.setuptools]
py-modules = ["context_cli"]